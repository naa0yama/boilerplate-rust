# yaml-language-server: $schema=https://www.schemastore.org/github-action.json
name: "Rust Security Audit"
description: "Run cargo audit to check for vulnerable dependencies"
runs:
  using: "composite"
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    - name: Install cargo-audit
      uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
      with:
        tool: cargo-audit

    - name: Run audit
      shell: bash
      run: cargo audit
