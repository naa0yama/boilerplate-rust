[env]
OTEL_EXPORTER_OTLP_ENDPOINT = "http://localhost:5080/api/default"
## renovate: datasource=github-releases packageName=openobserve/openobserve versioning=semver automerge=true
OPENOBSERVE_VERSION = "v0.92.2"

# graft:keep-start
# Project-specific dependencies are listed here.

RUST_LOG = "warn,brust=trace"
# graft:keep-end

[tools]
"aqua:ast-grep/ast-grep" = "0.45.3"
"aqua:cli/cli" = "2.102.0"
"aqua:EmbarkStudios/cargo-deny" = "0.20.2"
"aqua:taiki-e/cargo-llvm-cov" = "0.9.1"
"cargo:cargo-nextest" = "0.9.146"
"cargo:cargo-sweep" = "0.8.0"
"github:naa0yama/graft" = "0.5.11"
"github:rust-secure-code/cargo-auditable" = "0.7.7"
actionlint = "1.7.12"
dprint = "0.59.0"
ghalint = "1.5.6"
gitleaks = "8.30.1"
node = "24"
pnpm = "11.10.0"
tmux = "3.6a"
usage = "6.12.0"
zizmor = "1.30.1"

[task_config]
includes = [".mise/tasks.toml", ".mise/overrides.toml"]
